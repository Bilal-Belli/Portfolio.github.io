        :root {

            // ==================== RENDER FUNCTIONS ====================
            
            // Get unique categories from data
            function getCategories() {
                const categories = new Set();
                projectsData.forEach(project => categories.add(project.category));
                return ['all', ...Array.from(categories)];
            }

            // Render category filter buttons
            function renderCategories() {
                const container = document.getElementById('categories');
                const categories = getCategories();
                
                const categoryNames = {
                    'all': 'All',
                    'web': 'Web Apps',
                    'desktop': 'Desktop Apps',
                    'extension': 'Chrome Extensions',
                    'mobile': 'Mobile Apps',
                    'poc': 'Proof of Concepts',
                    'ai': 'AI / ML'
                };

                container.innerHTML = categories.map(cat => 
                    `<button class="category-pill ${cat === 'all' ? 'active' : ''}" data-filter="${cat}">
                        ${categoryNames[cat] || cat.charAt(0).toUpperCase() + cat.slice(1)}
                    </button>`
                ).join('');
            }

            // Render project cards
            function renderProjects(category = 'all') {
                const grid = document.getElementById('projectGrid');
                
                const filteredProjects = category === 'all' 
                    ? projectsData 
                    : projectsData.filter(p => p.category === category);

                if (filteredProjects.length === 0) {
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <p class="text-muted">No projects found in this category.</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = filteredProjects.map(project => {
                    // Generate tags HTML
                    const tagsHtml = project.tags.map(tag => 
                        `<span class="badge">${tag}</span>`
                    ).join('');

                    // Generate links HTML
                    const linksHtml = Object.entries(project.links).map(([key, url]) => {
                        const icon = key === 'github' ? 'bi-github' : 'bi-play-circle';
                        const label = key === 'github' ? 'GitHub' : 
                                     key === 'demo' ? 'Demo' : key.charAt(0).toUpperCase() + key.slice(1);
                        return `<a href="${url}"><i class="bi ${icon} me-1"></i> ${label}</a>`;
                    }).join('');

                    return `
                        <div class="col-lg-4 col-md-6 project-item" data-category="${project.category}">
                            <div class="project-card">
                                <h5>${project.title}</h5>
                                <p class="text-secondary small" style="flex:1;">${project.description}</p>
                                <div class="mb-2">
                                    ${tagsHtml}
                                </div>
                                <div class="project-links">
                                    ${linksHtml}
                                </div>
                                <small class="text-uppercase text-muted mt-1" style="font-size:0.6rem;letter-spacing:0.04em;">
                                    ${project.type}
                                </small>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // ==================== FILTER LOGIC ====================
            function setupFiltering() {
                const filterButtons = document.querySelectorAll('.category-pill');
                
                filterButtons.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        // Update active class
                        filterButtons.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        
                        const filter = this.getAttribute('data-filter');
                        renderProjects(filter);
                    });
                });
            }

            // ==================== INIT ====================
            function init() {
                renderCategories();
                renderProjects('all');
                setupFiltering();
            }

            // Run when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
