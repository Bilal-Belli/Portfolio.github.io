<!DOCTYPE html>
<html>

<head>
    <title>Bilal Belli - Certificates</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Certificates of Bilal Belli - Software Engineer.">
    <link rel="canonical" href="https://bilalbelli.eu/">
    <meta name="robots" content="index,follow">

    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bb-white: #ffffff;
            --bb-light: #f8fafc;
            --bb-deep: #0a979e;
            --bb-dark: #1e293b;
            --bb-gray: #e9edf2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bb-white);
            color: var(--bb-dark);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* navbar */
        .navbar-brand {
            font-weight: 700;
            color: var(--bb-deep);
            letter-spacing: -0.3px;
        }

        .navbar-brand:hover {
            color: var(--bb-deep);
        }

        .btn-deep {
            background: var(--bb-deep);
            color: white;
            border-radius: 40px;
            padding: 0.4rem 1.5rem;
            font-weight: 500;
            border: none;
            transition: 0.25s;
        }

        .btn-deep:hover {
            background: #087a80;
            color: white;
        }

        .section-title {
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.02em;
            border-left: 5px solid var(--bb-deep);
            padding-left: 1rem;
        }

        .footer {
            background: var(--bb-light);
            border-top: 1px solid #e2e8f0;
            padding: 2.5rem 0;
        }

        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: 1rem 0;
        }

        .certificate-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            display: block;
            cursor: pointer;
            text-decoration: none;
        }

        .certificate-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.5s ease;
            display: block;
        }

        .certificate-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 151, 158, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            padding: 1.5rem;
        }

        .certificate-item:hover .certificate-overlay {
            opacity: 1;
        }

        .certificate-item:hover img {
            transform: scale(1.1);
        }

        .certificate-overlay h3 {
            color: #ffffff;
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .certificate-overlay span {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            font-weight: 600;
            transform: translateY(20px);
            transition: transform 0.3s ease 0.1s;
        }

        .certificate-item:hover .certificate-overlay h3,
        .certificate-item:hover .certificate-overlay span {
            transform: translateY(0);
        }

        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: scaleIn 0.3s ease;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: white;
            padding: 0.5rem;
        }

        .lightbox-info {
            color: white;
            text-align: center;
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }

        .lightbox-info h3 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
            color: #47d1ae;
        }

        .lightbox-info span {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            display: block;
            margin-top: 0.1rem;
        }

        .lightbox-close {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 10000;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg) scale(1.1);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .lightbox-close i {
            font-size: 1.5rem;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%) scale(1.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .lightbox-nav.prev {
            left: -80px;
        }

        .lightbox-nav.next {
            right: -80px;
        }

        .lightbox-counter {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-top: 0.8rem;
            letter-spacing: 0.05em;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .certificates-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }

            .certificate-item img {
                height: 180px;
            }

            .lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .lightbox-nav.prev {
                left: -20px;
            }

            .lightbox-nav.next {
                right: -20px;
            }

            .lightbox-close {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
                font-size: 1.5rem;
            }

            .lightbox-close i {
                font-size: 1.3rem;
            }

            .lightbox-content img {
                max-height: 70vh;
            }
        }

        @media (max-width: 480px) {
            .certificates-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }

            .certificate-item img {
                height: 130px;
            }

            .certificate-overlay h3 {
                font-size: 0.9rem;
            }

            .certificate-overlay span {
                font-size: 0.75rem;
            }

            .lightbox-close {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .lightbox-close i {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-2 sticky-top shadow-sm"
        style="border-color: #e9edf2 !important;">
        <div class="container">
            <a class="navbar-brand" href="#">Bilal Belli</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-1">
                    <li class="nav-item ms-2"><a class="btn btn-deep btn-sm" href="/index.html">Go Back</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== CERTIFICATES SECTION ===== -->
    <div id="certificates_section">
        <div class="container">
            <div class="row">
                <div class="col-lg-6 mt-5">
                    <h2 class="section-title">Certificates</h2>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="certificates-grid" id="certificatesGrid">
                <!-- Dynamically rendered -->
            </div>
        </div>
    </div>

    <!-- ===== LIGHTBOX ===== -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close">
            <i class="bi bi-x-lg"></i>
        </button>
        <div class="lightbox-content">
            <button class="lightbox-nav prev" id="lightboxPrev" aria-label="Previous">
                <i class="bi bi-chevron-left"></i>
            </button>
            <button class="lightbox-nav next" id="lightboxNext" aria-label="Next">
                <i class="bi bi-chevron-right"></i>
            </button>
            <img id="lightboxImage" src="" alt="Certificate">
            <div class="lightbox-info">
                <h3 id="lightboxTitle">Title</h3>
                <span id="lightboxDescription">Description</span>
            </div>
            <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
        </div>
    </div>

    <footer class="footer">
        <div class="container text-center text-secondary small">
            <span>© 2026 Bilal Belli</span>
        </div>
    </footer>

    <!-- ===== DYNAMIC SCRIPT ===== -->
    <script>
        (function() {
            // ==================== DATA ====================
            const certificatesData = [
                {
                    id: 1,
                    title: "Coursera",
                    description: "Operating Systems",
                    image: "images/certificates/OS.png",
                    alt: "Coursera Operating Systems"
                },
                {
                    id: 2,
                    title: "Cybrary",
                    description: "Network Administration Management",
                    image: "images/certificates/NOM.png",
                    alt: "Cybrary Network Administration"
                },
                {
                    id: 3,
                    title: "SoloLearn",
                    description: "Java course",
                    image: "images/certificates/java_sololearn.png",
                    alt: "SoloLearn Java"
                },
                {
                    id: 4,
                    title: "Montpellier University",
                    description: "Software Engineering Diploma",
                    image: "images/certificates/DUM.jpg",
                    alt: "Montpellier University Diploma"
                },
                {
                    id: 5,
                    title: "ESI ex INI",
                    description: "Computer Systems Engineering Diploma",
                    image: "images/certificates/DM.png",
                    alt: "ESI Computer Systems Engineering"
                },
                {
                    id: 6,
                    title: "ESI ex INI",
                    description: "Computer Science Master's Diploma",
                    image: "images/certificates/DIE.png",
                    alt: "ESI Master's Diploma"
                }
            ];

            let currentIndex = 0;

            // ==================== RENDER CERTIFICATES ====================
            function renderCertificates() {
                const grid = document.getElementById('certificatesGrid');
                
                grid.innerHTML = certificatesData.map((cert, index) => `
                    <div class="certificate-item" data-index="${index}">
                        <img src="${cert.image}" alt="${cert.alt}" loading="lazy">
                        <div class="certificate-overlay">
                            <h3>${cert.title}</h3>
                            <span>${cert.description}</span>
                        </div>
                    </div>
                `).join('');

                // Add click listeners to each certificate
                document.querySelectorAll('.certificate-item').forEach(item => {
                    item.addEventListener('click', function(e) {
                        const index = parseInt(this.getAttribute('data-index'));
                        openLightbox(index);
                    });
                });
            }

            // ==================== LIGHTBOX FUNCTIONS ====================
            function openLightbox(index) {
                currentIndex = index;
                const cert = certificatesData[index];
                const overlay = document.getElementById('lightboxOverlay');
                const image = document.getElementById('lightboxImage');
                const title = document.getElementById('lightboxTitle');
                const description = document.getElementById('lightboxDescription');
                const counter = document.getElementById('lightboxCounter');

                image.src = cert.image;
                image.alt = cert.alt;
                title.textContent = cert.title;
                description.textContent = cert.description;
                counter.textContent = `${index + 1} / ${certificatesData.length}`;

                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                const overlay = document.getElementById('lightboxOverlay');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function navigateLightbox(direction) {
                const newIndex = currentIndex + direction;
                if (newIndex >= 0 && newIndex < certificatesData.length) {
                    openLightbox(newIndex);
                }
            }

            // ==================== KEYBOARD SUPPORT ====================
            document.addEventListener('keydown', function(e) {
                const overlay = document.getElementById('lightboxOverlay');
                if (!overlay.classList.contains('active')) return;

                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowLeft') {
                    navigateLightbox(-1);
                } else if (e.key === 'ArrowRight') {
                    navigateLightbox(1);
                }
            });

            // ==================== INIT ====================
            function init() {
                renderCertificates();

                // Lightbox controls
                document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
                document.getElementById('lightboxPrev').addEventListener('click', () => navigateLightbox(-1));
                document.getElementById('lightboxNext').addEventListener('click', () => navigateLightbox(1));

                // Close on overlay click (not on image or controls)
                document.getElementById('lightboxOverlay').addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeLightbox();
                    }
                });

                // Touch support for mobile
                let touchStartX = 0;
                let touchEndX = 0;
                
                document.getElementById('lightboxOverlay').addEventListener('touchstart', function(e) {
                    touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });
                
                document.getElementById('lightboxOverlay').addEventListener('touchend', function(e) {
                    touchEndX = e.changedTouches[0].screenX;
                    const diff = touchStartX - touchEndX;
                    if (Math.abs(diff) > 50) {
                        if (diff > 0) {
                            navigateLightbox(1);
                        } else {
                            navigateLightbox(-1);
                        }
                    }
                }, { passive: true });
            }

            // Run when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
